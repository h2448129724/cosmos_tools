[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-personal-toolbox"
version = "0.1.0"
description = "Personal Cosmos image, labeling, and data toolbox"
requires-python = ">=3.12"
dependencies = ["numpy", "Pillow", "opencv-python", "PySide6", "openpyxl", "pyyaml"]

[project.scripts]
cosmos-toolbox = "cosmos_toolbox.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cosmos_toolbox*", "img_tools*", "apps*", "shared*"]

[tool.setuptools.package-dir]
cabf = "shared/cabf_common/cabf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "shared/cabf_common", "../.."]

[tool.ruff]
target-version = "py312"
line-length = 120
